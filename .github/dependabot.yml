version: 2
updates:
  # See ADR-004 — Politique de sévérité SCA et défense en profondeur.
  # Advisory-driven PRs get the "security" label automatically so they can be
  # fast-tracked independently of the dev/production dependency groups.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - security
    groups:
      # `major` inclus (#639) : les paquets vitest s'epinglent mutuellement en
      # version exacte (`@vitest/coverage-v8@X` exige `vitest: "X"`). Hors du
      # groupe, une majeure revient en PR separees, chacune impossible a merger
      # seule — le scenario qui a fait echouer #622 et #623.
      dev-dependencies:
        dependency-type: development
        update-types:
          - major
          - minor
          - patch
      production-dependencies:
        dependency-type: production
        update-types:
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - security

