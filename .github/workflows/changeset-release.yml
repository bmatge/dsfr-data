name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Le PAT `AUTOMATION_TOKEN` (classic, scopes `repo` + `workflow` : le meme
      # jeton ecrit sur le miroir de l'organisation, qu'un fine-grained ne couvre
      # pas) quand il est pose, `GITHUB_TOKEN` sinon. La difference : une PR
      # ou un tag pousses par GITHUB_TOKEN ne declenchent AUCUN workflow — la PR de
      # release n'avait donc aucun check, et le ruleset de `main` la bloque. Avec le
      # PAT, ses checks partent seuls et le tag `v*` declenche mirror-sync.yml.
      # Sans PAT : geste de secours dans CLAUDE.md § Versioning.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: 'chore: release'
          commit-message: 'chore: release'
          version-script: npm run version-packages
          publish-script: npm run release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag release
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          TAG="v${VERSION}"
          echo "Publishing tag ${TAG}"
          git tag "${TAG}"
          git push origin "${TAG}"
        env:
          GITHUB_TOKEN: ${{ secrets.AUTOMATION_TOKEN || secrets.GITHUB_TOKEN }}
