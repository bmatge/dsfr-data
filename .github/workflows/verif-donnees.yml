name: Vérification des données

# Chaque chiffre affiche par la lib est recalcule par une SECONDE
# implementation (`tools/oracle`), ecrite a part et qui n'importe rien de
# `packages/` (ADR-122, test-garde `tests/oracle/guard.test.ts`). Un ecart a la
# precision affichee est un echec.
#
# Ce workflow ne fait tourner que les controles DETERMINISTES : les reponses
# d'API sont servies par `page.route` depuis `tests/verif-donnees/fixtures.ts`,
# et l'oracle recalcule depuis les MEMES lignes. Aucune API tierce, donc
# BLOQUANT sur chaque PR (meme modele que e2e-layout.yml).
#
# Les controles VIVANTS, qui dependent des vraies API du banc d'essai, vivent
# dans oracle.yml : la nuit, a la demande, jamais bloquant.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verif-donnees:
    name: Chiffres affichés vs recalcul indépendant
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le serveur de dev sert la lib depuis packages/core/src (vite.config.ts,
      # redirection /dist), mais `@dsfr-data/shared` se resout par les exports
      # du package — donc packages/shared/dist (ARCHITECTURE.md §12). Les deux
      # doivent exister avant `npm run dev`, sinon la page rend une lib a
      # moitie perimee et les ecarts designent le mauvais coupable.
      - name: Build shared + app-ui
        run: npm run build:shared && npm run build:app-ui

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Playwright demarre `npm run dev` lui-meme (webServer dans
      # e2e/playwright.config.ts) et attend le port 5173.
      - name: Vérification (mode déterministe)
        run: npm run verif

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verif-donnees-results
          path: |
            tools/oracle/out/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # La TROISIEME VOIX (#880) : l'oracle Python (stdlib, tools/oracle-py/)
  # recalcule les attentes deterministes depuis les memes jeux JSON, et le
  # fichier d'attendus est VERSIONNE (tests/verif-donnees/attendus.json).
  # Un attendu qui change sans etre committe est un echec ; un attendu committe
  # qui change est un diff relu. Aucune dependance Python : python3 seul.
  attendus:
    name: Attendus figés de la troisième voix (Python stdlib)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # L'interpreteur est EPINGLE : sans cela le runner prend le python3 de
      # l'image, qui change sans preavis. La stdlib seule, aucun paquet — le
      # cache pip n'a rien a mettre en cache.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: python3
        run: |
          if ! command -v python3 >/dev/null; then
            echo "::error::python3 introuvable — installer Python 3.11+ (stdlib seule, aucun paquet)"
            exit 1
          fi
          python3 --version

      - name: Regénérer les attendus (verif:manifests puis oracle.py)
        run: npm run verif:attendus

      # LE GARDE-FOU, et RIEN QUE LUI : `attendus.json` ne porte que des
      # chiffres et les conventions qui les produisent. La version exacte de
      # l'interpreteur est ECRITE, mais dans le fichier de provenance, hors de
      # la zone comparee (tools/oracle/out/, ignore par git) — sinon le diff
      # rougit sur la seule ligne d'en-tete des que le runner n'a pas le Python
      # de l'auteur (3.12.3 contre 3.11.5, toutes valeurs egales par ailleurs),
      # et un controle de conformite instable est un controle qu'on abandonne.
      - name: Provenance de la troisième voix (hors zone gardée)
        run: cat tools/oracle/out/attendus-provenance.json

      - name: Les attendus committés sont ceux que la troisième voix produit
        run: git diff --exit-code -- tests/verif-donnees/attendus.json
