name: Builder E2E

# Les CINQ specs déterministes de `tests/builder-e2e`, sur chaque PR (#869, #1081).
#
# Le reste du dossier n'est PAS câblé ici, et ce n'est pas un oubli : les specs
# historiques du Builder pilotent l'UI par ses `id` HTML et par des
# `waitForTimeout` fixes, et 56 de leurs 72 cas sont rouges. Ils sont ARCHIVÉS
# depuis #868 (`*.archive.ts`, hors `testMatch`, relançables avec
# `BUILDER_E2E_ARCHIVES=1`) : leur contenu reste la trace de ce qui était
# couvert, `typecheck:tests` continue de les compiler, mais ils ne sont plus
# ramassés. Les fichiers `*.tool.ts` n'ont aucune assertion et sont hors
# `testMatch` eux aussi (#867).
#
# Conséquence sur ce workflow : AUCUNE. Il nomme ses specs une par une.
#
# Ce qui rend ces cinq-là bloquants :
#   - `builder-ia-recette` + `layout-diagnostic-recette` : 43 cas, 16 s, aucune
#     API tierce (réseau figé par `api-harness.ts`, DSFR Chart depuis
#     node_modules, lib servie depuis la source par le serveur de dev) ;
#   - `export-html-api-recette` : 61 cas, 11 s, ni serveur ni réseau (tout par
#     `page.route()`), vert depuis #866 — mais il lit le bundle construit,
#     d'où le `npm run build` ci-dessous ;
#   - `studio-recette` + `studio-navigation-recette` (#1081) : le Studio IA
#     remplace l'Assistant IA comme entrée usager. Les 16 types rendus comme
#     blocs du Studio, la nav qui y mène, la redirection de `apps/builder-ia/`
#     et son échappement `?ancien=1` (par lequel passent les deux specs de
#     l'ancien Assistant). 21 cas, sans réseau tiers.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  builder-e2e:
    name: Recette Builder et export (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `export-html-api-recette` sert `packages/core/dist` à la place du CDN :
      # le build de core est nécessaire, et le serveur de dev exige app-ui par
      # ailleurs (ARCHITECTURE.md §12).
      #
      # `npm run build` ne construit QUE le workspace `dsfr-data` : sur un
      # runner propre, `packages/core` ne trouve alors pas `@dsfr-data/shared/lib`
      # et `tsc` s'arrête sur une trentaine de TS2307. En local l'erreur ne se
      # voit pas — `packages/shared/lib` traîne depuis un build antérieur.
      # `build:shared` d'abord, donc, comme le fait `e2e-layout.yml`.
      - name: Build
        run: npm run build:shared && npm run build && npm run build:app-ui

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Playwright démarre `npm run dev` lui-même (webServer dans
      # tests/builder-e2e/playwright.config.ts) et attend le port 5173.
      - name: Specs déterministes
        run: >-
          npx playwright test --config tests/builder-e2e/playwright.config.ts
          tests/builder-e2e/export-html-api-recette.spec.ts
          tests/builder-e2e/builder-ia-recette.spec.ts
          tests/builder-e2e/layout-diagnostic-recette.spec.ts
          tests/builder-e2e/studio-recette.spec.ts
          tests/builder-e2e/studio-navigation-recette.spec.ts

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: builder-e2e-results
          path: |
            test-results/
            tests/builder-e2e/report/
          if-no-files-found: ignore
          retention-days: 7
