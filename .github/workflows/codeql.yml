name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Hebdomadaire — lundi 06:00 UTC (les CVE arrivent aussi après le build)
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          config: |
            paths-ignore:
              - dist
              - app-dist
              - node_modules
              - packages/**/dist
              - tests
              - e2e
              # Code archivé : ne tourne pas, n'est compilé par aucun tsconfig,
              # n'est pas publié. Même intention que `tests` et `e2e` ci-dessus —
              # le spike #889 y vivait d'ailleurs sous e2e/, donc déjà ignoré.
              # Un spike qui compare innerHTML au clonage DOM CONTIENT le motif
              # dangereux : c'est son objet, pas un défaut à corriger.
              - docs/archive
              - '**/*.test.ts'
              - '**/*.spec.ts'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.38.1

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.38.1
        with:
          category: '/language:${{ matrix.language }}'
