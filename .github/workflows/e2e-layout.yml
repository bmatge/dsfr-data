name: E2E layout

# Mise en page MESUREE dans un vrai navigateur, sur chaque PR.
#
# Deux regressions livrees en 0.29.0 et 0.29.1 (#822 : colonnage KPI, #825 :
# carte a 0 px en plein ecran) sont passees au vert sous happy-dom : les
# tests unitaires lisaient le TEXTE des feuilles CSS, jamais un style calcule
# — happy-dom ne calcule ni float, ni flex, ni hauteur. Ces specs lisent des
# rectangles (`getBoundingClientRect`) et deux largeurs d'ecran.
#
# DETERMINISTE, donc sur PR (a la difference de guide-examples.yml, planifie) :
# aucune API tierce — tuiles coupees par `page.route`, DSFR Chart charge depuis
# node_modules, lib servie depuis la source par le serveur de dev.
#
# `source-lazy.spec.ts` (#931) n'est pas de la mise en page : il COMPTE des
# requêtes reseau dans un vrai navigateur, sur des panneaux d'onglets en
# `display:none`. Meme raison d'etre ici — happy-dom n'a pas
# d'IntersectionObserver et ne connaît pas la notion de boîte — et memes
# criteres : deterministe (JSON local), sans API tierce, sur PR.
#
# `buttons.spec.ts` (#542, branche ici par #1118) mesure lui aussi des boites
# et des styles calcules : cibles >= 24 px (WCAG 2.5.8) et `:focus-visible`,
# sur 14 pages et sur les panneaux Assistant / Diagnostic ouverts. Il
# n'etait lance nulle part : une classe maison l'avait rougi sans bruit.

#
# `kpi-source-en-panne.spec.ts` (#1222) mesure la HAUTEUR d'une tuile de KPI
# dont la source echoue (503, 404, reseau coupe) : la forme compacte existe
# pour qu'elle garde les 140 px de ses voisines, en largeur bureau et a 375 px.
# Panne posee par `page.route`, jeux en fichiers du depot.
#
# `map-idle.spec.ts` (BUG-039) et `map-insets.spec.ts` (BUG-034) comptent des
# formes POSEES sur des cartes Leaflet reelles — la carte hote et ses encarts,
# chacune initialisee a sa visibilite. Le doublon de BUG-034 venait de l'ORDRE
# de ces initialisations : aucun DOM simule ne le rejoue. Tuiles coupees,
# donnees locales, faux portail servi par `page.route`.
#
# `chart-axis-bounds.spec.ts` (#1273) lit les ECHELLES Chart.js reellement
# appliquees par type de graphique (bornes x-min / x-max / y-min / y-max), sur
# le vrai DSFR Chart : la decision se teste sous happy-dom, pas l'axe dessine.
# Quatre defauts mesures dans un navigateur etaient invisibles ailleurs
# (categories fantomes, bornes ignorees, arrondi a la graduation).
#
# `chart-cadre-html.spec.ts` (#1289) n'est pas de la mise en page non plus : il
# pose une charge (`<img onerror>`, et les contournements du nettoyeur) dans
# chaque attribut du cadre officiel et du graphique, sur le vrai DSFR Chart, et
# echoue si l'une s'EXECUTE. DSFR Chart pose le contenu de la fenetre et
# l'unite des infobulles par `innerHTML` ; happy-dom n'execute pas un
# `onerror` et ne lit pas une balise comme Chromium. Meme criteres :
# deterministe, DSFR Chart depuis node_modules, aucun reseau.
#
# `panne-partout.spec.ts` (#1288) fait tomber de vraies sources (200 puis 503,
# 404, reseau coupe) sous de vrais composants : le tableau equivalent ne doit
# plus rien exporter, la couche de carte ne plus rien tracer (formes Leaflet de
# la carte hote ET de son encart, grappes, canevas de la carte de chaleur), une
# page de liste refusee ne pas passer pour la page demandee, les filtres ne
# plus repondre. happy-dom ne trace aucune forme, ne produit aucun fichier, ne
# tient pas le focus d'un bouton desactive et ne mesure ni boite ni contraste.
# Donnees servies par `page.route`, tuiles coupees, bureau et 375 px.
#
# `dernier-releve.spec.ts` (#1288, `stale-if-error`) fait tomber les memes
# sources quand elles DEMANDENT le dernier releve : le chiffre reste, marque et
# date de son chargement. Ce qu'aucun DOM simule ne voit : l'horloge
# (`page.clock` — l'heure affichee est celle du chargement, et le bloc bascule
# SEUL au message de panne passe la duree), le canevas et les formes Leaflet
# desatures dont le contraste est mesure sur les pixels reellement peints
# (3:1, en clair et en sombre), la tuile de KPI qui garde ses 140 px, le
# fichier exporte date dans son nom. Memes criteres : deterministe, aucun reseau.
#
# `map-bandeau-max-items.spec.ts` (#1307) mesure ou tombe le bandeau
# « N affichés sur M » d'une couche tronquee quand une legende (et des encarts)
# sont poses sous la carte : dans l'emprise du volet Leaflet, hors de la
# legende, bandeaux de deux couches empiles sans se chevaucher, a 1280 et a
# 375 px. Frere du conteneur Leaflet, il est positionne dans l'hote, que la
# legende allonge : aucune hauteur n'existe sous happy-dom. Donnees inline,
# tuiles absentes.
#
# `pagination-serveur-chargement.spec.ts` (#1305) tient une page serveur en
# chargement (le faux serveur la retient jusqu'a ce que le test la libere) et
# mesure : la pagination ne descend pas d'un pixel, le bouton « Page suivante »
# garde le focus clavier (Entree, puis Entree de nouveau), le compte reste et la
# region live annonce la page, `url-sync` ecrit la page demandee. Liste et
# fiches, 1280 et 375 px. Donnees servies par `page.route`. Le meme spec tient
# les boutons de BORD : Entree repetee sur « Page suivante » jusqu'a la derniere
# page (et « Page precedente » jusqu'a la premiere), le focus reste sur le
# bouton, `aria-disabled="true"` et jamais `disabled`, couleur inactive du DSFR
# calculee par la vraie feuille. Pagination cliente et serveur.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e-layout:
    name: Mise en page mesurée (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Le serveur de dev sert la lib depuis packages/core/src (vite.config.ts,
      # redirection /dist), mais les apps chargent packages/app-ui/dist et le
      # typage lit packages/shared/dist (ARCHITECTURE.md §12) : les deux
      # doivent exister avant `npm run dev`.
      - name: Build shared + app-ui
        run: npm run build:shared && npm run build:app-ui

      - name: Install Playwright (chromium)
        run: npx playwright install --with-deps chromium

      # Playwright demarre `npm run dev` lui-meme (webServer dans
      # e2e/playwright.config.ts) et attend le port 5173.
      - name: Layout specs
        run: >-
          npx playwright test --config e2e/playwright.config.ts
          e2e/map-fullscreen.spec.ts
          e2e/layout-grid.spec.ts
          e2e/layout-map.spec.ts
          e2e/chart-legend.spec.ts
          e2e/chart-axis-bounds.spec.ts
          e2e/chart-cadre-html.spec.ts
          e2e/mobile-chrome.spec.ts
          e2e/source-lazy.spec.ts
          e2e/buttons.spec.ts
          e2e/map-idle.spec.ts
          e2e/kpi-source-en-panne.spec.ts
          e2e/map-insets.spec.ts
          e2e/panne-partout.spec.ts
          e2e/dernier-releve.spec.ts
          e2e/map-bandeau-max-items.spec.ts
          e2e/pagination-serveur-chargement.spec.ts
          --project=chromium

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-layout-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
