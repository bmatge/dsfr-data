name: Release Tauri

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (ex: v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Tag v* precedent (ordre semver) : sans previous_tag_name explicite,
          # l'auto-generation GitHub choisit une mauvaise base (les tags
          # dsfr-data@* de changesets s'intercalent) et les notes cumulent
          # tout l'historique depuis v0.5.x.
          PREV=$(git tag --sort=-v:refname | grep '^v' | sed -n "/^${TAG}\$/,\$p" | sed -n 2p)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(-f tag_name="${{ steps.version.outputs.tag }}" \
            -f name="${{ steps.version.outputs.tag }}" \
            -f target_commitish="${{ github.sha }}" \
            -F draft=true \
            -F generate_release_notes=true)
          if [ -n "${{ steps.version.outputs.prev }}" ]; then
            ARGS+=(-f previous_tag_name="${{ steps.version.outputs.prev }}")
          fi
          RELEASE_ID=$(gh api repos/${{ github.repository }}/releases "${ARGS[@]}" --jq '.id')
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-15
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
          - platform: windows-latest
            args: ''
            rust_target: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build frontend
        # Tauri detecte `__TAURI__` au runtime et ignore VITE_PROXY_URL —
        # le check fail-fast (cf. issue #168 PR-3) est volontairement bypass.
        env:
          DSFR_DATA_DEV_BUILD: '1'
        run: npm run build:all && node scripts/build-app.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
          uploadPlainBinary: true
          args: ${{ matrix.args }} --verbose

  publish-release:
    needs: [create-release, build-tauri]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
