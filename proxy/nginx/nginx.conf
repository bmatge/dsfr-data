# =============================================================================
# Proxy CORS autonome pour dsfr-data
# =============================================================================
#
# Ce fichier configure un reverse proxy Nginx dont le seul role est de
# contourner les restrictions CORS des APIs externes utilisees par les
# composants dsfr-data.
#
# Routes :
#   /grist-proxy/      -> https://docs.getgrist.com/
#   /grist-gouv-proxy/ -> https://grist.numerique.gouv.fr/
#   /albert-proxy/     -> https://albert.api.etalab.gouv.fr/
#   /tabular-proxy/    -> https://tabular-api.data.gouv.fr/
#   /cors-proxy        -> cible lue dans l'en-tete X-Target-URL, BORNEE
#                         (https, nom DNS public, GET/POST — docs/SECURITY.md)
#
# Aucun fichier statique n'est servi. Ce proxy peut etre deploye
# independamment de l'application frontend.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Parametres generaux
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    log_format beacon '$time_iso8601|$http_referer|$arg_c|$arg_t|$remote_addr|$arg_r';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Resolvers DNS necessaires pour les proxy_pass vers des noms de domaine.
    # 8.8.8.8 = Google DNS, 1.1.1.1 = Cloudflare DNS.
    # Adapter si vous utilisez un resolver interne.
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # -------------------------------------------------------------------------
    # Bornage du proxy generique (/cors-proxy)
    # -------------------------------------------------------------------------
    # Ce que la regle admet, refuse et ne couvre pas : docs/SECURITY.md
    # §"Proxy générique". NE PAS MODIFIER UN MOTIF ICI SEUL : la source de verite
    # est scripts/lib/garde-proxy.cjs, et docker/garde-proxy.conf porte les memes
    # `map`. Le test tests/proxy/garde-proxy-coherence.test.ts echoue au premier
    # ecart.

    # >>> garde-proxy : cible
    # 1 = cible refusée. Le premier motif qui correspond l'emporte.
    map $http_x_target_url $proxy_cible_refusee {
        default 1;
        # Noms réservés aux réseaux locaux.
        "~*^https://(?:[a-z0-9-]+\.)+(?:localhost|local|localdomain|internal|intranet|lan|home|corp|private|arpa|test|invalid|onion)(?:[/?]|$)" 1;
        # Seule forme admise : https, nom DNS public, ni identifiants ni port.
        "~*^https://(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:[a-z]{2,63}|xn--[a-z0-9-]{1,59})(?:[/?][^\x00-\x20\x7f]*)?$" 0;
    }

    # 1 = la cible est le domaine par lequel l'instance est appelée.
    map "$host|$http_x_target_url" $proxy_cible_instance {
        default 0;
        "~*^([^|]+)\|https://\1(?:[/?]|$)" 1;
    }
    # <<< garde-proxy : cible

    # Limite de debit. Derriere un reverse proxy, $remote_addr est celui du
    # reverse : la cle par client est X-Forwarded-For quand il existe. Un client
    # qui joint nginx sans reverse peut forger cet en-tete, d'ou le second
    # plafond, global.
    map $http_x_forwarded_for $proxy_cle_client {
        ""      $binary_remote_addr;
        default $http_x_forwarded_for;
    }
    limit_req_zone $proxy_cle_client zone=cors_proxy_client:10m rate=10r/s;
    limit_req_zone $server_name zone=proxy_generique_global:1m rate=50r/s;

    # -------------------------------------------------------------------------
    # Serveur proxy
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # En-tetes de securite globaux
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # -----------------------------------------------------------------
        # Health check minimal
        # -----------------------------------------------------------------
        location = /health {
            access_log off;
            return 200 '{"status":"ok"}';
            add_header Content-Type application/json;
        }

        # -----------------------------------------------------------------
        # Beacon de tracking des widgets deployes
        # -----------------------------------------------------------------
        location = /beacon {
            access_log /var/log/nginx/beacon.log beacon;
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Cache-Control' 'no-store' always;
            return 204;
        }

        # =================================================================
        # Proxy : Grist (docs.getgrist.com)
        # =================================================================
        location /grist-proxy/ {
            # -- Preflight OPTIONS ----------------------------------------
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Masquer les headers CORS de l'upstream pour eviter les doublons
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';

            # -- CORS pour les requetes normales --------------------------
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            # -- Proxy vers l'upstream ------------------------------------
            proxy_pass https://docs.getgrist.com/;
            proxy_ssl_server_name on;
            proxy_set_header Host docs.getgrist.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Les cookies de l'instance ne partent pas chez un tiers
            proxy_set_header Cookie "";

            # Desactiver le cache Nginx pour toujours relayer les donnees fraiches
            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # =================================================================
        # Proxy : Grist Numerique Gouv (grist.numerique.gouv.fr)
        # =================================================================
        location /grist-gouv-proxy/ {
            # -- Preflight OPTIONS ----------------------------------------
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Masquer les headers CORS de l'upstream pour eviter les doublons
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';

            # -- CORS pour les requetes normales --------------------------
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            # -- Proxy vers l'upstream ------------------------------------
            proxy_pass https://grist.numerique.gouv.fr/;
            proxy_ssl_server_name on;
            proxy_set_header Host grist.numerique.gouv.fr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Les cookies de l'instance ne partent pas chez un tiers
            proxy_set_header Cookie "";

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # =================================================================
        # Proxy : Albert IA API (albert.api.etalab.gouv.fr)
        # =================================================================
        location /albert-proxy/ {
            # -- Preflight OPTIONS ----------------------------------------
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Masquer les headers CORS de l'upstream pour eviter les doublons
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';

            # -- CORS pour les requetes normales --------------------------
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            # -- Proxy vers l'upstream ------------------------------------
            proxy_pass https://albert.api.etalab.gouv.fr/;
            proxy_ssl_server_name on;
            proxy_set_header Host albert.api.etalab.gouv.fr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Les cookies de l'instance ne partent pas chez un tiers
            proxy_set_header Cookie "";

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # =================================================================
        # Proxy : INSEE Melodi API (api.insee.fr)
        # =================================================================
        location /insee-proxy/ {
            # -- Preflight OPTIONS ----------------------------------------
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Masquer les headers CORS de l'upstream pour eviter les doublons
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';

            # -- CORS pour les requetes normales --------------------------
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            # -- Proxy vers l'upstream ------------------------------------
            proxy_pass https://api.insee.fr/;
            proxy_ssl_server_name on;
            proxy_set_header Host api.insee.fr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Les cookies de l'instance ne partent pas chez un tiers
            proxy_set_header Cookie "";

            proxy_set_header Origin '';
            proxy_set_header Referer '';

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # =================================================================
        # Proxy : Tabular API data.gouv.fr (tabular-api.data.gouv.fr)
        # =================================================================
        location /tabular-proxy/ {
            # -- Preflight OPTIONS ----------------------------------------
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                add_header 'Content-Type' 'text/plain; charset=UTF-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            # Masquer les headers CORS de l'upstream pour eviter les doublons
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';

            # -- CORS pour les requetes normales --------------------------
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;

            # -- Proxy vers l'upstream ------------------------------------
            proxy_pass https://tabular-api.data.gouv.fr/;
            proxy_ssl_server_name on;
            proxy_set_header Host tabular-api.data.gouv.fr;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Les cookies de l'instance ne partent pas chez un tiers
            proxy_set_header Cookie "";

            proxy_no_cache 1;
            proxy_cache_bypass 1;
        }

        # =================================================================
        # Proxy CORS generique (X-Target-URL header pattern)
        # =================================================================
        location /cors-proxy {
            default_type application/json;

            # Preflight CORS
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
                # Wildcard : autorise tout en-tete custom (Apikey, x-api-key, etc.)
                # afin que le preflight passe meme pour les connexions API a cle en
                # en-tete. `Authorization` doit etre liste explicitement car exclu
                # du wildcard `*` par la spec CORS (requetes sans credentials).
                add_header 'Access-Control-Allow-Headers' '*, Authorization' always;
                add_header 'Access-Control-Max-Age' 86400 always;
                return 204;
            }

            # >>> garde-proxy : /cors-proxy
            # Bornage : tout refus tombe AVANT le moindre appel amont.
            if ($request_method !~ ^(GET|POST)$) {
                return 405 '{"error":"méthode non admise par le proxy"}';
            }
            if ($http_x_target_url = '') {
                return 400 '{"error":"en-tête X-Target-URL absent"}';
            }
            if ($proxy_cible_refusee) {
                return 403 '{"error":"cible non admise par le proxy"}';
            }
            if ($proxy_cible_instance) {
                return 403 '{"error":"cible non admise par le proxy"}';
            }

            limit_req zone=cors_proxy_client burst=40 nodelay;
            limit_req zone=proxy_generique_global burst=200 nodelay;
            limit_req_status 429;
            client_max_body_size 1m;

            # Lire l'URL cible depuis le header X-Target-URL
            set $target_url $http_x_target_url;

            # Masquer les headers CORS upstream
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            proxy_hide_header 'Access-Control-Allow-Headers';
            proxy_hide_header 'Access-Control-Allow-Credentials';

            # CORS ouvert : un widget embarque sur un site tiers appelle cette route
            # depuis une autre origine (`use-proxy` + `proxy-url`).
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Target-URL' always;

            proxy_pass $target_url;
            # https seul, certificat de l'amont verifie : un nom public qui resoudrait
            # vers une adresse interne n'y presentera pas de certificat valide a ce nom.
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 4;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_connect_timeout 10s;
            # Une redirection de l'amont repart telle quelle, jamais suivie ; un
            # X-Accel-Redirect de l'amont ne declenche aucune redirection interne.
            proxy_ignore_headers X-Accel-Redirect;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Ne pas forwarder les headers internes, ni les cookies de l'instance
            proxy_set_header X-Target-URL "";
            proxy_set_header Origin "";
            proxy_set_header Referer "";
            proxy_set_header Cookie "";
            # <<< garde-proxy : /cors-proxy
        }

        # -----------------------------------------------------------------
        # Tout le reste -> 404
        # -----------------------------------------------------------------
        location / {
            return 404 '{"error":"route inconnue"}';
            add_header Content-Type application/json;
        }
    }
}
