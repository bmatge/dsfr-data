# Relais cachable (ADR-155) — le contrat, pour UN hôte autorisé.
#
# Inclus par la `location` de chaque hôte, APRÈS `set $relais_hote` et `set $relais_ttl`
# (voir hotes.server.example.conf). Rien ici ne dépend de l'hôte : ne pas le modifier
# pour un hôte, mais dans sa `location`.

include relais/relais-reponse.conf;

# --- Refus, avant tout appel à l'amont ----------------------------------------
# Chaque `return` porte un corps : sans lui, nginx passerait par `error_page`.

# C-URL-3 : 8 000 caractères au plus, chemin et requête compris.
if ($request_uri ~ "^.{8001}") {
    return 414 '{"error":"url-too-long","message":"URL de plus de 8000 caracteres."}';
}
# C-URL-2, C-SSRF-1 à 3 : la `location` a été choisie sur le chemin normalisé ; le
# segment d'hôte BRUT doit être, octet pour octet, celui de cette `location`.
if ($relais_hote_brut != $relais_hote) {
    return 403 '{"error":"host-not-allowed","message":"Hote absent de la liste blanche du relais."}';
}
# C-MET-1 : lecture seule.
if ($request_method !~ "^(?:GET|HEAD|OPTIONS)$") {
    return 405 '{"error":"method-not-allowed","message":"Le relais est en lecture seule."}';
}
# C-SSRF-4, C-INJ-1 : chemin ou requête qui ne sont pas déjà sous forme canonique.
if ($relais_cible = "") {
    return 400 '{"error":"invalid-path","message":"Chemin ou requete refuses par le relais."}';
}
# C-MET-3 : la pré-vérification CORS est répondue ici, sans contacter l'amont.
if ($request_method = OPTIONS) {
    return 204;
}

# --- Débit et simultanéité ----------------------------------------------------
# Un cache servi compte aussi : nginx applique ces limites avant de consulter son cache.
limit_req  zone=relais_adresse burst=600 nodelay;
limit_req  zone=relais_hote    burst=1000 nodelay;
limit_req_status 429;
limit_conn relais_connexions 32;
# 529 : code interne, traduit en 503 + Retry-After par `error_page` — pour le
# distinguer d'un 503 de l'amont, qui devient 502.
limit_conn_status 529;

# --- Vers l'amont (C-AMONT-1, C-AMONT-2, C-MET-2) -----------------------------
# Rien de ce qu'envoie le visiteur : ni en-tête, ni corps. Seuls partent les en-têtes
# posés ci-dessous. `$relais_cle` vient de la `map` des clés (cles.example.conf) :
# vide pour un hôte sans clé, et l'en-tête n'est alors pas envoyé.
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_pass_request_body    off;
proxy_set_header Host            $relais_hote;
proxy_set_header Accept          "application/json, application/geo+json, text/csv;q=0.9, */*;q=0.1";
proxy_set_header Accept-Encoding identity;
proxy_set_header User-Agent      "dsfr-data-relay";
proxy_set_header Connection      "";
proxy_set_header Authorization   $relais_cle;

# --- TLS vers l'amont (C-SSRF-6) ----------------------------------------------
# Inertes quand `proxy_pass` est en `http://` (banc de conformance seulement).
proxy_ssl_server_name on;
proxy_ssl_name        $relais_hote;
proxy_ssl_verify      on;
proxy_ssl_verify_depth 4;
# Debian, Ubuntu, Alpine. RHEL et dérivés : /etc/pki/tls/certs/ca-bundle.crt
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_protocols   TLSv1.2 TLSv1.3;

# --- Délais (C-DOS-1) ---------------------------------------------------------
# Ce sont des délais ENTRE DEUX LECTURES, pas un délai global : nginx n'en a pas.
proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    10s;
proxy_next_upstream         error;
proxy_next_upstream_tries   2;
proxy_next_upstream_timeout 10s;

# --- Tampons ------------------------------------------------------------------
# Le tampon d'en-tête contient aussi la clé de cache, donc l'URL : 8 000 caractères.
proxy_buffering         on;
proxy_buffer_size       16k;
proxy_buffers           8 16k;
proxy_busy_buffers_size 32k;

# --- Cache (C-CACHE-1 à C-CACHE-6) --------------------------------------------
# Clé : l'hôte et la cible brute, rien d'autre. Aucun en-tête du visiteur n'y entre.
proxy_cache         relais;
proxy_cache_key     "$relais_hote$relais_cible";
proxy_cache_methods GET HEAD;
# Les en-têtes de cache de l'amont ne décident de rien : seule la durée de la
# `location` compte. `X-Accel-Redirect` ignoré : sinon l'amont ferait servir par nginx
# n'importe quelle `location` interne du site.
proxy_ignore_headers Cache-Control Expires Set-Cookie Vary
                     X-Accel-Expires X-Accel-Redirect X-Accel-Limit-Rate
                     X-Accel-Buffering X-Accel-Charset;
# Seules les 200 sont mises en cache (`proxy_cache_valid 200 …` dans la `location`).
# Exception voulue, d'UNE seconde : une 401, 403, 404 ou 410 de l'amont remplace
# l'entrée du cache, ce qui tient lieu de purge (C-CACHE-6) — nginx n'en a pas d'autre.
# Sans cette ligne, la panne suivante resservirait la donnée que le portail vient de
# retirer. Elle n'est jamais servie au-delà de cette seconde. Voir le README.
proxy_cache_valid 401 403 404 410 1s;
proxy_cache_lock         on;
proxy_cache_lock_timeout 10s;
proxy_cache_lock_age     10s;
# C-CACHE-5 : périmé servi si l'amont tombe, répond 5xx ou 429. Jamais sur une autre 4xx.
proxy_cache_use_stale error timeout invalid_header updating
                      http_500 http_502 http_503 http_504 http_429;

# Ni `Range` ni tranche : toujours la réponse entière (C-CACHE-2).
max_ranges 0;

# --- Vers le navigateur (C-NAV-1) ---------------------------------------------
# nginx ne sait retirer que des en-têtes NOMMÉS : c'est une liste noire, tenue large.
# Le type de contenu est retiré puis reposé depuis la liste fermée (relais-http.conf).
proxy_hide_header Content-Type;
proxy_hide_header Set-Cookie;
proxy_hide_header Set-Cookie2;
proxy_hide_header Vary;
proxy_hide_header Cache-Control;
proxy_hide_header Expires;
proxy_hide_header Pragma;
proxy_hide_header Age;
proxy_hide_header Via;
proxy_hide_header Location;
proxy_hide_header Content-Location;
proxy_hide_header Refresh;
proxy_hide_header Link;
proxy_hide_header Allow;
proxy_hide_header Retry-After;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;
proxy_hide_header Timing-Allow-Origin;
proxy_hide_header X-RateLimit-Limit;
proxy_hide_header X-RateLimit-Remaining;
proxy_hide_header X-RateLimit-Reset;
proxy_hide_header X-RateLimit-Used;
proxy_hide_header RateLimit;
proxy_hide_header RateLimit-Limit;
proxy_hide_header RateLimit-Remaining;
proxy_hide_header RateLimit-Reset;
proxy_hide_header RateLimit-Policy;
proxy_hide_header X-Powered-By;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header X-XSS-Protection;
proxy_hide_header Content-Security-Policy;
proxy_hide_header Content-Security-Policy-Report-Only;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header Alt-Svc;
proxy_hide_header Clear-Site-Data;
proxy_hide_header Report-To;
proxy_hide_header Reporting-Endpoints;
proxy_hide_header NEL;
proxy_hide_header Server-Timing;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Resource-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header Cross-Origin-Embedder-Policy;
proxy_hide_header Service-Worker-Allowed;
proxy_hide_header SourceMap;
proxy_hide_header X-SourceMap;
proxy_hide_header WWW-Authenticate;
proxy_hide_header Proxy-Authenticate;
proxy_hide_header X-Relay-Cache;

# Compression par nginx, selon l'`Accept-Encoding` du visiteur (d'où le `Vary`). Le type
# de contenu ayant été retiré plus haut, `gzip_types` ne peut pas le lire : `*`.
gzip            on;
gzip_types      *;
gzip_min_length 256;
gzip_proxied    any;

# --- Erreurs (docs/RELAY.md §5) -----------------------------------------------
# Toute réponse de l'amont qui n'est pas un succès est remplacée par celle du relais :
# statut du barème, corps fixe, en-têtes du relais. Aucune 3xx n'atteint le navigateur
# (C-SSRF-7) : nginx ne suit pas les redirections, elles deviennent 502.
proxy_intercept_errors on;

error_page 401 403 = @relais_403;
error_page 404     = @relais_404;
error_page 410     = @relais_410;
error_page 408 504 = @relais_504;
error_page 429     = @relais_429;
error_page 529     = @relais_503;

error_page 300 301 302 303 304 305 306 307 308 309 310 311 312 313 314 315 316 317 318 319 = @relais_redirection;
error_page 320 321 322 323 324 325 326 327 328 329 330 331 332 333 334 335 336 337 338 339 = @relais_redirection;
error_page 340 341 342 343 344 345 346 347 348 349 350 351 352 353 354 355 356 357 358 359 = @relais_redirection;
error_page 360 361 362 363 364 365 366 367 368 369 370 371 372 373 374 375 376 377 378 379 = @relais_redirection;
error_page 380 381 382 383 384 385 386 387 388 389 390 391 392 393 394 395 396 397 398 399 = @relais_redirection;

# Les autres 4xx gardent leur statut (pas de `=`), avec le corps du relais.
error_page 400 402 405 406 407 409 411 412 413 414 415 416 417 418 419 420 421 422 423 424 @relais_rejet;
error_page 425 426 427 428 430 431 432 433 434 435 436 437 438 439 440 441 442 443 444 445 @relais_rejet;
error_page 446 447 448 449 450 451 452 453 454 455 456 457 458 459 460 461 462 463 464 465 @relais_rejet;
error_page 466 467 468 469 470 471 472 473 474 475 476 477 478 479 480 481 482 483 484 485 @relais_rejet;
error_page 486 487 488 489 490 491 492 493 494 495 496 497 498 @relais_rejet;

error_page 500 501 502 503 505 506 507 508 509 510 511 512 513 514 515 516 517 518 519 520 = @relais_502;
error_page 521 522 523 524 525 526 527 528 530 531 532 533 534 535 536 537 538 539 540 541 = @relais_502;
error_page 542 543 544 545 546 547 548 549 550 551 552 553 554 555 556 557 558 559 560 561 = @relais_502;
error_page 562 563 564 565 566 567 568 569 570 571 572 573 574 575 576 577 578 579 580 581 = @relais_502;
error_page 582 583 584 585 586 587 588 589 590 591 592 593 594 595 596 597 598 599 = @relais_502;
