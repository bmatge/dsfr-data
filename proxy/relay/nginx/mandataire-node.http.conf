# nginx placé DEVANT le relais Node de référence — niveau `http {}`.
#
# Autre montage que l'extrait nginx seul : ici le contrat est tenu par le relais Node
# (proxy/relay/node/), nginx n'apporte que le TLS, la compression et le cache partagé.
# Va avec mandataire-node.server.conf.

# Mêmes raisons que relais-http.conf : une URL de relais fait jusqu'à 8 000 caractères.
large_client_header_buffers 4 16k;

proxy_cache_path /var/cache/nginx/relais-devant levels=1:2 keys_zone=relais_devant:10m
                 max_size=512m inactive=1d use_temp_path=off;
