# Relais cachable (ADR-155) — extrait nginx, niveau `server {}`.
#
# S'inclut tel quel dans le `server {}` du site, une fois, à côté des `location`
# d'hôtes (hotes.server.example.conf). Ne dépend d'aucun site.

# --- Tout ce qui n'est pas un hôte de la liste blanche -------------------------
# C-SSRF-1 : la liste blanche est la liste des `location` d'hôtes. Ce qui n'en trouve
# aucune arrive ici : 403, sans contacter personne. `^~` : aucune `location` à
# expression rationnelle du site (`~ \.json$`…) ne passe devant le relais.
location ^~ /donnees-relais/ {
    include relais/relais-reponse.conf;
    return 403 '{"error":"host-not-allowed","message":"Hote absent de la liste blanche du relais."}';
}

location = /donnees-relais {
    include relais/relais-reponse.conf;
    return 404 '{"error":"not-found","message":"Forme attendue : <relais>/<hote>/<chemin>."}';
}

# --- Réponses d'erreur (docs/RELAY.md §5) --------------------------------------
# Atteintes par les `error_page` de relais-hote.conf. Le corps est fixe : rien de la
# requête du visiteur ni de la réponse de l'amont n'y entre (C-FUITE-1).

location @relais_403 {
    include relais/relais-reponse.conf;
    return 403 '{"error":"upstream-forbidden","message":"Le portail refuse l acces a ces donnees."}';
}

location @relais_404 {
    include relais/relais-reponse.conf;
    return 404 '{"error":"upstream-not-found","message":"Donnees introuvables sur le portail."}';
}

location @relais_410 {
    include relais/relais-reponse.conf;
    return 410 '{"error":"upstream-not-found","message":"Donnees retirees du portail."}';
}

location @relais_429 {
    include relais/relais-reponse.conf;
    return 429 '{"error":"rate-limited","message":"Trop de requetes, reessayer plus tard."}';
}

location @relais_502 {
    include relais/relais-reponse.conf;
    return 502 '{"error":"upstream-error","message":"Le portail ne repond pas correctement."}';
}

location @relais_redirection {
    include relais/relais-reponse.conf;
    return 502 '{"error":"upstream-redirect-refused","message":"Le portail redirige : le relais ne suit pas."}';
}

location @relais_503 {
    include relais/relais-reponse.conf;
    return 503 '{"error":"relay-busy","message":"Relais occupe, reessayer."}';
}

location @relais_504 {
    include relais/relais-reponse.conf;
    return 504 '{"error":"upstream-timeout","message":"Le portail ne repond pas dans le delai."}';
}

# Les autres 4xx de l'amont : `error_page` sans `=` garde le statut d'origine, quel que
# soit celui écrit ici.
location @relais_rejet {
    include relais/relais-reponse.conf;
    return 200 '{"error":"upstream-rejected","message":"Le portail refuse cette requete."}';
}
