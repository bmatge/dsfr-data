# Relais cachable (ADR-155) — la liste blanche, niveau `server {}`. EXEMPLE : à adapter.
#
# UNE `location` STATIQUE PAR HÔTE AUTORISÉ : c'est la liste blanche. L'hôte n'est jamais
# une variable passée à `proxy_pass` — il est écrit trois fois, à l'identique : dans le
# nom de la `location`, dans `set $relais_hote`, et dans le bloc `upstream` que nomme
# `proxy_pass` (hotes.http.example.conf).
#
# Le nom de la `location` n'a PAS de barre finale : avec elle, nginx répondrait de
# lui-même une redirection 301 à `/donnees-relais/<hôte>`. La comparaison exacte de
# l'hôte est faite par relais-hote.conf, sur la requête brute.
#
# Les deux durées d'une `location` vont ensemble : `$relais_ttl` est ce qu'annonce
# `Cache-Control`, `proxy_cache_valid 200` est ce que garde le cache de nginx.

# Un portail ouvert, durée par défaut du contrat : 300 s.
location ^~ /donnees-relais/donnees.portail.example {
    set $relais_hote donnees.portail.example;
    set $relais_ttl  300;
    include relais/relais-hote.conf;
    proxy_cache_valid 200 300s;
    proxy_pass https://relais_donnees_portail_example$relais_cible;
}

# Un portail dont les données changent vite : 60 s.
location ^~ /donnees-relais/autre.portail.example {
    set $relais_hote autre.portail.example;
    set $relais_ttl  60;
    include relais/relais-hote.conf;
    proxy_cache_valid 200 60s;
    proxy_pass https://relais_autre_portail_example$relais_cible;
}

# Un portail à clé. La clé est dans la `map` des clés (cles.example.conf), hors du dépôt.
# Une clé EXIGE un préfixe de chemin : elle rend public tout ce qu'elle sait lire sur
# l'hôte (docs/RELAY.md §3). Le préfixe est comparé à la cible brute, entre `\Q` et `\E`
# (texte littéral : rien à échapper), et finit par une barre — frontière de segment.
# Plusieurs préfixes : "^(?:\Q/a/\E|\Q/b/\E)".
location ^~ /donnees-relais/portail-prive.example {
    set $relais_hote portail-prive.example;
    set $relais_ttl  300;
    include relais/relais-hote.conf;
    if ($relais_cible !~ "^\Q/api/explore/v2.1/catalog/datasets/jeu-publiable/\E") {
        return 403 '{"error":"path-not-allowed","message":"Chemin hors des prefixes autorises pour cet hote."}';
    }
    proxy_cache_valid 200 300s;
    proxy_pass https://relais_portail_prive_example$relais_cible;
}
