# Relais cachable (ADR-155) — les amonts, niveau `http {}`. EXEMPLE : à adapter.
#
# Un bloc `upstream` par hôte autorisé. C'est ici, et seulement ici, qu'est écrite
# l'adresse jointe : le nom est fixe, le port est 443, et `proxy_pass` (dans
# hotes.server.example.conf) nomme ce bloc en toutes lettres — jamais une variable.
#
# nginx résout le nom AU DÉMARRAGE et à chaque rechargement : si le portail change
# d'adresse, recharger nginx (ou, à partir de nginx 1.27.3, ajouter `resolve` à la
# ligne `server` et une directive `resolver`). Un nom qui ne se résout pas empêche
# nginx de démarrer.
#
# `max_conns` borne les connexions simultanées vers l'hôte (C-DOS-4) ; `zone` partage
# ce compte entre les processus de nginx.

upstream relais_donnees_portail_example {
    zone relais_amonts 256k;
    server donnees.portail.example:443 max_conns=64;
    keepalive 8;
}

upstream relais_autre_portail_example {
    zone relais_amonts 256k;
    server autre.portail.example:443 max_conns=64;
    keepalive 8;
}

upstream relais_portail_prive_example {
    zone relais_amonts 256k;
    server portail-prive.example:443 max_conns=64;
    keepalive 8;
}
