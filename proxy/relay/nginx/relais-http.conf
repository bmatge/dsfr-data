# Relais cachable (ADR-155) — extrait nginx, niveau `http {}`.
#
# Contrat : docs/RELAY.md. Mode d'emploi, garanties et limites : README.md de ce dossier.
# Ce fichier ne dépend d'aucun site : il s'inclut tel quel dans `http {}`, une fois.
# Le préfixe du relais, `/donnees-relais`, est écrit dans les deux premières `map`
# ci-dessous, dans relais-server.conf et dans le nom de chaque `location` d'hôte : pour
# en changer, le remplacer partout.

# --- Ligne de requête ---------------------------------------------------------
# Le contrat admet une URL de relais de 8 000 caractères (C-URL-3). Avec le défaut de
# nginx (8k pour la ligne entière), une URL plus longue est refusée par nginx lui-même,
# avant de router, sans les en-têtes du relais.
large_client_header_buffers 4 16k;

# --- Cache --------------------------------------------------------------------
# `max_size` borne le disque (C-CACHE-4). `inactive` est la durée de vie d'une entrée
# que plus personne ne demande ; une entrée demandée sans cesse ne vieillit pas, et
# nginx ne connaît pas d'autre borne à ce qu'il sert périmé pendant une panne (README).
proxy_cache_path /var/cache/nginx/relais levels=1:2 keys_zone=relais:10m
                 max_size=512m inactive=1h use_temp_path=off;

# --- Débit et connexions ------------------------------------------------------
# Par adresse (C-DOS-3) : 10 requêtes par seconde, la rafale est réglée dans
# relais-hote.conf.
limit_req_zone  $binary_remote_addr zone=relais_adresse:10m rate=10r/s;
# Par hôte, toutes adresses confondues : le budget que le relais Node n'a pas.
# `$relais_hote` est posé par la `location` de l'hôte.
limit_req_zone  $relais_hote        zone=relais_hote:1m     rate=50r/s;
# Requêtes simultanées d'une même adresse (C-DOS-4).
limit_conn_zone $binary_remote_addr zone=relais_connexions:10m;

# --- La cible, lue dans la requête BRUTE --------------------------------------
# nginx choisit la `location` sur le chemin NORMALISÉ (`%2e%2e` décodé, `..` résolu,
# `//` fusionné). Le relais, lui, ne transmet que la forme BRUTE, et seulement si elle
# est déjà canonique : `$request_uri` est la cible de requête telle que reçue.

# Segment d'hôte brut : comparé octet pour octet au nom de la `location` (C-URL-2).
map $request_uri $relais_hote_brut {
    default "";
    "~^/donnees-relais/(?<relais_h>[^/?]*)" $relais_h;
}

# Chemin et requête bruts, transmis à l'amont octet pour octet (C-URL-1). Vide si la
# forme est refusée (C-SSRF-4, C-INJ-1) : `.`, `..`, `..;`, `//`, `\`, `%2e`, `%2f`,
# `%5c`, `%25`, `%3b`, caractère de contrôle encodé, UTF-8 surlong, pleine chasse,
# `%` isolé ; dans la requête : `#`, `%00`, `%0a`, `%0d`. C'est la grammaire de
# `proxy/relay/node/target.mjs` ; `tests/relay/nginx/extrait-nginx.test.ts` garde les
# deux égales sur un corpus. Un caractère par tour de boucle : aucun retour arrière
# coûteux sur une URL de 8 000 caractères.
map $request_uri $relais_cible {
    default "";
    "~^/donnees-relais/[^/?]*(?<relais_c>/(?:(?!\.\.?(?:[;/?]|$))(?:[A-Za-z0-9\-._~!$&'()*+,;=:@]|%(?!2[eEfF]|5[cC]|25|3[bB]|[01][0-9A-Fa-f]|7[fF]|[cC][01]|[eE]0%[89][0-9A-Fa-f]|[fF]0%8[0-9A-Fa-f]|[fF]8%8[0-7]|[fF][cC]%8[0-3]|[eE][fF]%[bB][cC]%(?:8[eEfF]|[bB][cC]))[0-9A-Fa-f]{2})+/)*(?:(?!\.\.?(?:[;/?]|$))(?:[A-Za-z0-9\-._~!$&'()*+,;=:@]|%(?!2[eEfF]|5[cC]|25|3[bB]|[01][0-9A-Fa-f]|7[fF]|[cC][01]|[eE]0%[89][0-9A-Fa-f]|[fF]0%8[0-9A-Fa-f]|[fF]8%8[0-7]|[fF][cC]%8[0-3]|[eE][fF]%[bB][cC]%(?:8[eEfF]|[bB][cC]))[0-9A-Fa-f]{2})+)?(?:\?(?:(?!%(?:00|0[aAdD]))[\x21\x22\x24-\x7e])*)?)$" $relais_c;
}

# --- En-têtes de réponse ------------------------------------------------------
# Type de contenu : liste FERMÉE, type comparé en entier (C-NAV-3). nginx ne sait pas
# refuser une réponse sur son type : ce qui n'est pas dans la liste est servi sous
# `application/octet-stream` (avec `nosniff` et la CSP), jamais sous son type d'origine.
map "$status:$upstream_http_content_type" $relais_type {
    default "";
    '~*^200:(?<relais_t>application/json|application/geo\+json|text/csv)[ ]*$' $relais_t;
    '~*^200:(?<relais_t>application/json|application/geo\+json|text/csv)[ ]*;[ ]*charset="?(?<relais_j>[a-z0-9._-]{1,40})"?[ ]*$' "$relais_t; charset=$relais_j";
    "~^200:" "application/octet-stream";
}

# Seule une 200 est cachable ; tout le reste est `no-store` (C-CACHE-1, C-CACHE-3).
# `$relais_ttl` est posé par la `location` de l'hôte.
map $status $relais_cache_control {
    default "no-store";
    200     "public, max-age=$relais_ttl, s-maxage=$relais_ttl, stale-while-revalidate=60, stale-if-error=3600";
}

# `Retry-After` : celui de l'amont s'il est un nombre de secondes, sinon une seconde.
map "$status:$upstream_http_retry_after" $relais_retry_after {
    default "";
    "~^429:(?<relais_r>[0-9]{1,5})$" $relais_r;
    "~^429:" 1;
    "~^503:" 1;
}

map $status $relais_allow {
    default "";
    405     "GET, HEAD, OPTIONS";
}

map $request_method $relais_cors_methodes {
    default "";
    OPTIONS "GET, HEAD, OPTIONS";
}

map $request_method $relais_cors_duree {
    default "";
    OPTIONS 86400;
}

# --- Journal (C-FUITE-2) ------------------------------------------------------
# Ni l'adresse du visiteur, ni ses en-têtes, ni la requête (ce que l'usager a tapé dans
# une recherche déléguée). `$uri` est le chemin, sans la requête.
log_format relais '$time_iso8601 $request_method $uri $status '
                  '$upstream_cache_status $body_bytes_sent $request_time';
