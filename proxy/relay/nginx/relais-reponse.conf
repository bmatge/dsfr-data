# Relais cachable (ADR-155) — ce que porte TOUTE réponse du relais.
#
# Inclus par chaque `location` du relais (hôtes, refus, erreurs) : `add_header` ne
# s'hérite pas d'un niveau à l'autre dès qu'un niveau en déclare un. `always` : les
# en-têtes valent aussi pour les erreurs (C-NAV-2, C-NAV-4).

server_tokens off;
uninitialized_variable_warn off;

# Les réponses écrites par le relais lui-même sont du JSON, jamais la page HTML
# d'erreur de nginx.
default_type application/json;

# CORS : lisible de toute origine, sans identifiants ; aucun en-tête de requête n'est
# autorisé (`Access-Control-Allow-Headers` absent, C-MET-3). `Retry-After` est exposé :
# la bibliothèque le lit pour réessayer un 503, y compris depuis une autre origine.
add_header Access-Control-Allow-Origin   "*"                    always;
add_header Access-Control-Expose-Headers "Retry-After"          always;
add_header Access-Control-Allow-Methods  $relais_cors_methodes  always;
add_header Access-Control-Max-Age        $relais_cors_duree     always;

# Le relais répond sur l'origine du site : rien de ce qu'il sert ne s'y exécute.
add_header X-Content-Type-Options  "nosniff"                      always;
add_header Content-Security-Policy "default-src 'none'; sandbox"  always;

add_header Cache-Control $relais_cache_control  always;
add_header Vary          "Accept-Encoding"      always;
add_header Content-Type  $relais_type           always;
add_header Allow         $relais_allow          always;
add_header Retry-After   $relais_retry_after    always;
add_header X-Relay-Cache $upstream_cache_status always;

# Journal sans adresse, sans en-tête, sans requête (C-FUITE-2). Le journal d'ERREURS de
# nginx, lui, porte l'adresse et la ligne de requête : voir le README.
access_log /var/log/nginx/relais.log relais;
