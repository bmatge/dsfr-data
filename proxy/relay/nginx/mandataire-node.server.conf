# nginx placé DEVANT le relais Node de référence — niveau `server {}`.
#
# Le relais Node écoute sur 127.0.0.1:8155 et porte tout le contrat (liste blanche,
# clé, en-têtes, plafonds). Va avec mandataire-node.http.conf.

location ^~ /donnees-relais/ {
    # Sans URI après le port : nginx transmet la cible de requête telle que reçue,
    # octet pour octet. Avec une barre finale, il transmettrait le chemin normalisé.
    proxy_pass http://127.0.0.1:8155;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # C-DOS-5 — OBLIGATOIRE dès que `trustedProxies` déclare cette machine au relais.
    # nginx POSE l'en-tête : il écrase ce qu'envoie le client. Un `proxy_pass` nu le
    # transmettrait tel quel, et chaque requête forgerait son adresse, donc son quota.
    proxy_set_header X-Forwarded-For $remote_addr;

    # Le relais refuse (503) un lecteur trop lent : c'est nginx qui absorbe la lenteur
    # du visiteur.
    proxy_buffering         on;
    proxy_buffer_size       16k;
    proxy_buffers           8 16k;
    proxy_busy_buffers_size 32k;

    # Cache devant le relais. Aucun `proxy_cache_valid` : la durée est celle que dicte
    # le `Cache-Control` du relais (`s-maxage`, `stale-while-revalidate`,
    # `stale-if-error`), et ses erreurs sont `no-store` — ni un 503, ni un 429, ni
    # aucune autre erreur n'est retenu. Ne pas ajouter `proxy_cache_valid any …` ni
    # `proxy_ignore_headers Cache-Control`.
    proxy_cache         relais_devant;
    proxy_cache_key     $request_uri;
    proxy_cache_methods GET HEAD;
    proxy_cache_lock    on;

    gzip            on;
    gzip_types      application/json application/geo+json text/csv;
    gzip_min_length 256;
    gzip_proxied    any;
}
