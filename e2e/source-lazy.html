<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fixture E2E — dsfr-data-source lazy : une page a onglets ne paie que l'onglet regarde (#931)</title>
  <!--
    Six onglets, huit sources chacun, quarante-huit sources en tout — la forme
    des deux generateurs de portrait du portail Sports. Les panneaux fermes
    sont en `hidden` (donc `display:none`), comme les panneaux non selectionnes
    du motif d'onglets DSFR : leurs consommateurs n'ont pas de boite, ils
    n'intersectent jamais, et l'observateur se declenche a l'ouverture.

    L'attribut `lazy` est pose par le parametre d'URL `?lazy=1`, pour mesurer
    la MEME page avant et apres.
  -->
  <script type="module" src="/dist/dsfr-data.esm.js"></script>
  <style>
    .panneau { min-height: 40vh; }
    [hidden] { display: none; }
  </style>
</head>

  <main>
    <h1>Portrait a onglets</h1>
    <nav>
      <button data-onglet="1">Onglet 1</button>
      <button data-onglet="2">Onglet 2</button>
      <button data-onglet="3">Onglet 3</button>
      <button data-onglet="4">Onglet 4</button>
      <button data-onglet="5">Onglet 5</button>
      <button data-onglet="6">Onglet 6</button>
    </nav>

  <script>
    // `lazy` pose avant l'analyse des balises : on reecrit le document ?
    // Non — les attributs sont deja la, on les retire quand ?lazy=1 est absent.
    document.querySelectorAll('button[data-onglet]').forEach((b) => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.panneau').forEach((p) => { p.hidden = true; });
        document.getElementById('panneau-' + b.dataset.onglet).hidden = false;
      });
    });
