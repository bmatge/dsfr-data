# Bornage du proxy générique (`/cors-proxy`, `/ia-proxy`) — niveau `http`.
#
# Copié dans /etc/nginx/conf.d/00-garde-proxy.conf par docker/Dockerfile et
# docker/Dockerfile.db ; les blocs `location` de nginx.conf et nginx-db.conf en
# lisent les variables. Ce que la règle admet, refuse et ne couvre pas :
# docs/SECURITY.md §"Proxy générique".
#
# NE PAS MODIFIER UN MOTIF ICI SEUL. La source de vérité est
# scripts/lib/garde-proxy.cjs (le même module borne le proxy du serveur de
# développement) ; proxy/nginx/nginx.conf recopie ces `map`. Le test
# tests/proxy/garde-proxy-coherence.test.ts échoue au premier écart.

# >>> garde-proxy : cible
# 1 = cible refusée. Le premier motif qui correspond l'emporte.
map $http_x_target_url $proxy_cible_refusee {
    default 1;
    # Noms réservés aux réseaux locaux.
    "~*^https://(?:[a-z0-9-]+\.)+(?:localhost|local|localdomain|internal|intranet|lan|home|corp|private|arpa|test|invalid|onion)(?:[/?]|$)" 1;
    # Seule forme admise : https, nom DNS public, ni identifiants ni port.
    "~*^https://(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:[a-z]{2,63}|xn--[a-z0-9-]{1,59})(?:[/?][^\x00-\x20\x7f]*)?$" 0;
}

# 1 = la cible est le domaine par lequel l'instance est appelée.
map "$host|$http_x_target_url" $proxy_cible_instance {
    default 0;
    "~*^([^|]+)\|https://\1(?:[/?]|$)" 1;
}
# <<< garde-proxy : cible

# Limite de débit. Derrière un reverse proxy, $remote_addr est celui du reverse :
# la clé par client est X-Forwarded-For quand il existe. Un client qui joint
# nginx sans reverse peut forger cet en-tête, d'où le second plafond, global.
map $http_x_forwarded_for $proxy_cle_client {
    ""      $binary_remote_addr;
    default $http_x_forwarded_for;
}
limit_req_zone $proxy_cle_client zone=cors_proxy_client:10m rate=10r/s;
limit_req_zone $proxy_cle_client zone=ia_proxy_client:10m rate=5r/s;
limit_req_zone $server_name zone=proxy_generique_global:1m rate=50r/s;

# Liste blanche OPTIONNELLE de /ia-proxy (1 = cible hors liste, refusée).
# Par défaut tout fournisseur est admis : l'usager du Studio IA saisit l'adresse
# de son API. Pour n'admettre que des fournisseurs choisis, passer `default` à 1
# et lister chaque hôte admis (docs/DEPLOYMENT.md §"Proxy générique").
map $http_x_target_url $ia_proxy_hors_liste {
    default 0;
    # "~*^https://albert\.api\.etalab\.gouv\.fr/" 0;
    # "~*^https://api\.mistral\.ai/" 0;
}
