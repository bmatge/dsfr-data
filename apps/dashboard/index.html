<!DOCTYPE html>
<html lang="fr" data-fr-scheme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts builder — Créer un tableau de bord</title>
  <style>@view-transition{navigation:auto}app-header:not(:defined){display:block;min-height:56px}app-footer:not(:defined){display:block;min-height:48px}</style>

  <!-- DSFR -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css" integrity="sha384-atVZ+aK6VI0nWyTEhKgze5InDJ+SWRRqa0BCZ2MTNyoOcBiHj1c3dGPdi6ML65B3" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/utility/utility.min.css" integrity="sha384-5P5DFFqorcEBpfnK9WHu/Ralfr7ZxyCZh0ryaJbgucSvc71+qRYdGvNEcyMqQwa/" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" integrity="sha384-6FSSi597BTd6QcnsBNoLclRKxTOyyYqkaucRjFgCNr8wHVCp0COLClSPY4Vy/bjh" crossorigin="anonymous">

  <!-- DSFR Chart -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css" integrity="sha384-5m9vgfA+uOR3qcY14HhRzWDK17cwEVXO75RSwv2KJXignSdIrOvz1xNaaDpWXCeu" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js" integrity="sha384-OJTIJmv0zL1Ym2Bd6hA0oHB25gTqveSogoyVtnN3cEJcm4qE28qzTEp56vJeeKIS" crossorigin="anonymous"></script>

  <!-- dsfr-data -->
  <script type="module" src="../../packages/core/dist/dsfr-data.esm.js"></script>
  <script type="module" src="../../packages/app-ui/dist/app-ui.esm.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="src/styles/dashboard.css">
</head>
<body>
  <!-- Header -->
  <app-header current-page="dashboard" base-path="../.."></app-header>

  <!-- Barre d'actions unique (docs/ux/actions.md §5, lot UX 2 #539). Ids
       historiques conservés (#btn-new, #btn-load, #btn-save, #btn-export,
       #btn-preview) ; le titre éditable et les templates restent dans la
       barre d'outils du canevas (.vde-toolbar). -->
  <app-action-bar heading="Créer un tableau de bord">
    <button slot="tertiary" id="tour-btn" data-variant="no-outline" class="fr-icon-question-line fr-btn--icon-left">Visite guidée</button>
    <button slot="tertiary" id="btn-new" class="fr-icon-add-line fr-btn--icon-left" title="Repartir d'un tableau de bord vierge">Nouveau</button>
    <button slot="tertiary" id="btn-preview" class="fr-icon-fullscreen-line fr-btn--icon-left" title="Afficher l'aperçu en plein écran">Plein écran</button>
    <button slot="secondary" id="btn-load" class="fr-icon-folder-2-line fr-btn--icon-left" title="Ouvrir un tableau de bord enregistré">Ouvrir</button>
    <app-menu slot="secondary" label="Exporter">
      <button id="btn-export" class="fr-icon-download-line" title="Télécharger le tableau de bord en page HTML autonome">Page HTML</button>
    </app-menu>
    <button slot="primary" id="btn-save" class="fr-icon-save-line fr-btn--icon-left">Enregistrer</button>
  </app-action-bar>

  <div class="vde-container">
    <!-- Sidebar gauche -->
    <aside class="vde-sidebar">
      <!-- Bibliothèque de widgets -->
      <div class="vde-sidebar-section">
        <h3><i class="ri-dashboard-line"></i> Widgets</h3>
        <div class="widget-library" id="widget-library">
          <div class="widget-item" draggable="true" data-widget-type="kpi">
            <i class="ri-number-1"></i>
            <span>KPI</span>
          </div>
          <div class="widget-item" draggable="true" data-widget-type="chart">
            <i class="ri-bar-chart-box-line"></i>
            <span>Graphique</span>
          </div>
          <div class="widget-item" draggable="true" data-widget-type="table">
            <i class="ri-table-line"></i>
            <span>Tableau</span>
          </div>
          <div class="widget-item" draggable="true" data-widget-type="text">
            <i class="ri-text"></i>
            <span>Texte</span>
          </div>
        </div>
      </div>

      <!-- Favoris -->
      <div class="vde-sidebar-section">
        <h3><i class="ri-star-line"></i> Mes favoris</h3>
        <div class="favorites-list" id="favorites-list">
          <p class="favorites-empty">Chargement...</p>
        </div>
      </div>

      <!-- Paramètres de grille -->
      <div class="vde-sidebar-section">
        <h3><i class="ri-settings-3-line"></i> Grille</h3>
        <div class="grid-settings">
          <label>
            Colonnes par défaut
            <span class="fr-hint-text" style="font-weight:400;">Nombre de widgets cote a cote par ligne</span>
            <select id="grid-columns">
              <option value="1">1 colonne</option>
              <option value="2" selected>2 colonnes</option>
              <option value="3">3 colonnes</option>
              <option value="4">4 colonnes</option>
            </select>
          </label>
          <label>
            Espacement
            <select id="grid-gap">
              <option value="fr-grid-row--gutters">Normal</option>
              <option value="">Sans espacement</option>
            </select>
          </label>
        </div>
      </div>

      <!-- Sources -->
      <div class="vde-sidebar-section">
        <h3><i class="ri-database-2-line"></i> Sources</h3>
        <div id="sources-list">
          <p class="favorites-empty">Aucune source</p>
        </div>
        <button class="fr-btn fr-btn--sm fr-btn--secondary fr-mt-1w" id="add-source-btn">
          <i class="ri-add-line"></i> Ajouter une source
        </button>
      </div>
    </aside>

    <!-- Zone principale -->
    <main class="vde-main" id="main-content">
      <!-- Toolbar -->
      <div class="vde-toolbar">
        <div class="vde-toolbar-left">
          <input type="text" class="dashboard-title-input" id="dashboard-title" value="Mon tableau de bord" placeholder="Titre du dashboard">
        </div>
        <div class="vde-toolbar-right">
          <div class="fr-select-group fr-select-group--sm" style="display:inline-block;min-width:auto;">
            <select id="template-select" class="fr-select fr-select--sm" style="padding:0.25rem 2rem 0.25rem 0.5rem;" aria-label="Templates">
              <option value="">Templates...</option>
              <option value="kpi-chart">3 KPIs + Graphique</option>
              <option value="two-charts">2 Graphiques</option>
              <option value="full">Dashboard complet</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Onglets DSFR natifs (docs/ux/actions.md §2.4, lot UX 4 #541) : le
           canevas est l'onglet « Aperçu » (C2), ids des panneaux conservés. -->
      <div class="fr-tabs vde-tabs">
        <ul class="fr-tabs__list" role="tablist" aria-label="Tableau de bord">
          <li role="presentation">
            <button type="button" id="tab-design-btn" class="fr-tabs__tab" tabindex="0" role="tab" aria-selected="true" aria-controls="tab-design">Aperçu</button>
          </li>
          <li role="presentation">
            <button type="button" id="tab-code-btn" class="fr-tabs__tab" tabindex="-1" role="tab" aria-selected="false" aria-controls="tab-code">Code</button>
          </li>
          <li role="presentation">
            <button type="button" id="tab-json-btn" class="fr-tabs__tab" tabindex="-1" role="tab" aria-selected="false" aria-controls="tab-json">JSON</button>
          </li>
        </ul>

      <!-- Aperçu (grille) -->
      <div class="fr-tabs__panel fr-tabs__panel--selected vde-tab-panel" id="tab-design" role="tabpanel" aria-labelledby="tab-design-btn" tabindex="0">
        <div class="vde-preview">
          <div class="vde-canvas">
            <div class="dashboard-grid" id="dashboard-grid">
              <!-- Ligne 1 -->
              <div class="fr-grid-row fr-grid-row--gutters dashboard-row" data-row="0">
                <div class="fr-col-12 fr-col-md-6">
                  <div class="drop-cell empty" data-row="0" data-col="0" data-colspan="6">
                    <div class="drop-cell-placeholder">
                      <i class="ri-add-circle-line"></i>
                      <span>Glisser un widget ici</span>
                    </div>
                  </div>
                </div>
                <div class="fr-col-12 fr-col-md-6">
                  <div class="drop-cell empty" data-row="0" data-col="1" data-colspan="6">
                    <div class="drop-cell-placeholder">
                      <i class="ri-add-circle-line"></i>
                      <span>Glisser un widget ici</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <button class="add-row-btn" id="add-row-btn">
              <i class="ri-add-line"></i> Ajouter une ligne
            </button>
          </div>
        </div>
      </div>

      <!-- Code -->
      <div class="fr-tabs__panel vde-tab-panel" id="tab-code" role="tabpanel" aria-labelledby="tab-code-btn" tabindex="0">
        <pre class="code-preview" id="generated-code"><!-- Le code sera généré ici --></pre>
      </div>

      <!-- JSON -->
      <div class="fr-tabs__panel vde-tab-panel" id="tab-json" role="tabpanel" aria-labelledby="tab-json-btn" tabindex="0">
        <pre class="code-preview" id="generated-json">{}</pre>
      </div>
      </div><!-- /.fr-tabs -->
    </main>
  </div>

  <!-- Modal de configuration -->
  <div class="config-modal" id="config-modal">
    <div class="config-modal-content">
      <div class="config-modal-header">
        <h3 id="config-modal-title">Configurer le widget</h3>
        <button class="fr-btn fr-btn--close" id="close-modal" title="Fermer">Fermer</button>
      </div>
      <div class="config-modal-body" id="config-modal-body">
        <!-- Contenu dynamique -->
      </div>
      <div class="config-modal-footer">
        <button class="fr-btn fr-btn--secondary" id="cancel-config">Annuler</button>
        <button class="fr-btn" id="apply-config">Appliquer</button>
      </div>
    </div>
  </div>

  <!-- Modal liste des dashboards -->
  <div class="config-modal" id="dashboards-modal">
    <div class="config-modal-content">
      <div class="config-modal-header">
        <h3>Mes tableaux de bord</h3>
        <button class="fr-btn fr-btn--close" id="close-dashboards-modal" title="Fermer">Fermer</button>
      </div>
      <div class="config-modal-body" id="dashboards-list">
        <!-- Liste dynamique -->
      </div>
    </div>
  </div>

  <!-- Modal de sauvegarde -->
  <div class="config-modal" id="save-modal">
    <div class="config-modal-content" style="max-width: 480px;">
      <div class="config-modal-header">
        <h3>Enregistrer le tableau de bord</h3>
        <button class="fr-btn fr-btn--close" id="close-save-modal" title="Fermer">Fermer</button>
      </div>
      <div class="config-modal-body">
        <div class="config-group">
          <label for="save-dashboard-name">Nom</label>
          <input type="text" class="fr-input" id="save-dashboard-name" placeholder="Mon tableau de bord">
        </div>
        <div class="config-group">
          <label for="save-dashboard-description">Description (optionnelle)</label>
          <textarea class="fr-input" id="save-dashboard-description" rows="3" placeholder="Decrivez votre tableau de bord..."></textarea>
        </div>
      </div>
      <div class="config-modal-footer">
        <button class="fr-btn fr-btn--secondary" id="cancel-save">Annuler</button>
        <button class="fr-btn fr-icon-save-line fr-btn--icon-left" id="confirm-save">Enregistrer</button>
      </div>
    </div>
  </div>

  <!-- Modal de prévisualisation -->
  <div class="preview-modal" id="preview-modal">
    <div class="preview-modal-header">
      <h3>Aperçu du tableau de bord</h3>
      <button class="fr-btn fr-btn--sm fr-btn--secondary" id="close-preview-modal">
        <i class="ri-close-line"></i> Fermer
      </button>
    </div>
    <div class="preview-modal-body">
      <iframe id="preview-iframe" sandbox="allow-scripts allow-same-origin" title="Aperçu du dashboard"></iframe>
    </div>
  </div>

  <!-- Footer -->
  <app-footer base-path="../.."></app-footer>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.module.min.js" integrity="sha384-gPgRd2+olihO/srZe/Bqw6iVLiiaL7meuri1d5YVMejwPXg7VehLSBeORYq9yh2F" crossorigin="anonymous"></script>
  <!-- App entry point -->
  <script type="module" src="src/main.ts"></script>
</body>
</html>
