<!DOCTYPE html>
<html lang="fr" data-fr-scheme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts builder — Créer une carte</title>
  <style>@view-transition{navigation:auto}app-header:not(:defined){display:block;min-height:96px}</style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css" integrity="sha384-atVZ+aK6VI0nWyTEhKgze5InDJ+SWRRqa0BCZ2MTNyoOcBiHj1c3dGPdi6ML65B3" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/utility/utility.min.css" integrity="sha384-5P5DFFqorcEBpfnK9WHu/Ralfr7ZxyCZh0ryaJbgucSvc71+qRYdGvNEcyMqQwa/" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" integrity="sha384-6FSSi597BTd6QcnsBNoLclRKxTOyyYqkaucRjFgCNr8wHVCp0COLClSPY4Vy/bjh" crossorigin="anonymous">
  <script type="module" src="../../packages/core/dist/dsfr-data.esm.js"></script>
  <script type="module" src="../../packages/app-ui/dist/app-ui.esm.js"></script>
  <script type="module" src="src/main.ts"></script>
</head>
<body class="carto-app">
  <app-header current-page="builder-carto" base-path="../../"></app-header>
  <!-- Barre d'actions unique (docs/ux/actions.md §5, lot UX 2 #539). Ids
       historiques conservés (#btn-execute, #btn-export, #btn-reset) ; la
       modale « code » reste jusqu'au PreviewPanel du lot 4 (#541). -->
  <app-action-bar heading="Créer une carte">
    <button slot="help" id="tour-btn" class="fr-icon-question-line">Visite guidée</button>
    <button slot="secondary" id="btn-export" class="fr-icon-clipboard-line fr-btn--icon-left">Copier le code</button>
    <button slot="tertiary" id="save-favorite-btn" class="fr-icon-star-line">Ajouter aux favoris</button>
    <button slot="tertiary" id="open-playground-btn" class="fr-icon-code-s-slash-line" title="Ouvrir le code de la carte dans le Playground">Ouvrir dans le Playground</button>
    <button slot="tertiary" id="btn-reset" class="fr-icon-add-line" title="Repartir d'une carte vierge">Nouveau</button>
    <button slot="primary" id="btn-execute" class="fr-icon-play-line fr-btn--icon-left">Générer</button>
  </app-action-bar>

  <!-- Onglets DSFR natifs Aperçu · Code (lot UX 4 #541) : la carte reste en
       page (visibility, pas display:none — Leaflet garde sa taille), le code
       remplace la modale « Intégrer la carte ». -->
  <div class="fr-tabs carto-tabs">
    <ul class="fr-tabs__list" role="tablist" aria-label="Carte">
      <li role="presentation">
        <button type="button" id="carto-tab-preview-btn" class="fr-tabs__tab" tabindex="0" role="tab" aria-selected="true" aria-controls="carto-tab-preview">Aperçu</button>
      </li>
      <li role="presentation">
        <button type="button" id="carto-tab-code-btn" class="fr-tabs__tab" tabindex="-1" role="tab" aria-selected="false" aria-controls="carto-tab-code">Code</button>
      </li>
    </ul>
    <div id="carto-tab-preview" class="fr-tabs__panel fr-tabs__panel--selected carto-tabs__panel" role="tabpanel" aria-labelledby="carto-tab-preview-btn" tabindex="0">
  <main id="main-content" class="carto-workspace">

    <!-- Canevas : la carte générée est l'apercu permanent -->
    <div id="map-canvas" class="carto-canvas">
      <p class="carto-canvas__hint" id="canvas-hint">
        <i class="ri-map-2-line" aria-hidden="true"></i><br>
        Choisissez vos données, la carte s'affiche ici.
      </p>
    </div>

    <!-- Colonne de panneaux flottants -->
    <div class="carto-panels">

      <section class="carto-panel carto-panel--collapsed" id="panel-carte" aria-label="Réglages de la carte">
        <button class="carto-panel__header" type="button" data-panel-toggle="panel-carte"
                aria-expanded="false" aria-controls="map-config">
          <span class="carto-panel__title"><i class="ri-map-2-line" aria-hidden="true"></i>Carte</span>
          <i class="ri-arrow-down-s-line carto-panel__arrow" aria-hidden="true"></i>
        </button>
        <div class="carto-panel__body" id="map-config" tabindex="0"></div>
      </section>

      <section class="carto-panel" id="panel-couches" aria-label="Couches de données">
        <div class="carto-panel__header carto-panel__header--split">
          <button class="carto-panel__header-toggle" type="button" data-panel-toggle="panel-couches"
                  aria-expanded="true" aria-controls="couches-body">
            <span class="carto-panel__title"><i class="ri-stack-line" aria-hidden="true"></i>Couches</span>
          </button>
          <div class="carto-panel__header-actions">
            <button id="btn-add-layer" class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-add-line fr-btn--icon-left" type="button" title="Ajouter une couche">Ajouter</button>
            <button class="carto-icon-btn app-btn--icon app-btn--icon--sm app-btn--icon--muted carto-panel__header-arrow" type="button" data-panel-toggle="panel-couches"
                    aria-expanded="true" aria-controls="couches-body" aria-label="Replier le panneau Couches">
              <i class="ri-arrow-down-s-line carto-panel__arrow" aria-hidden="true"></i>
            </button>
          </div>
        </div>
        <div class="carto-panel__body" id="couches-body" tabindex="0">
          <ul id="layers-list" class="carto-layers__list"></ul>
          <div id="layer-data-config"></div>
        </div>
      </section>

      <section class="carto-panel" id="panel-elements" aria-label="Éléments de la couche">
        <button class="carto-panel__header" type="button" data-panel-toggle="panel-elements"
                aria-expanded="true" aria-controls="layer-config">
          <span class="carto-panel__title"><i class="ri-paint-brush-line" aria-hidden="true"></i>Éléments</span>
          <i class="ri-arrow-down-s-line carto-panel__arrow" aria-hidden="true"></i>
        </button>
        <div class="carto-panel__body" id="layer-config" tabindex="0"></div>
      </section>

    </div>

    <!-- Diagnostic d'apercu -->
    <div id="preview-status" class="carto-status" role="status" aria-live="polite" hidden></div>

    <!-- Modale d'arrivée (rendue par main.ts) -->
    <div id="onboard-modal"></div>

  </main>
    </div>
    <div id="carto-tab-code" class="fr-tabs__panel carto-tabs__panel" role="tabpanel" aria-labelledby="carto-tab-code-btn" tabindex="0">
      <div class="carto-export__body">
        <p class="carto-msg carto-msg--muted">Copiez ce code et collez-le dans votre CMS ou votre page HTML — « Copier le code » dans la barre d'actions copie le mode sélectionné.</p>
        <div class="carto-export__toolbar">
          <label for="gen-mode" class="fr-label">Mode de génération</label>
          <select id="gen-mode" class="fr-select">
            <option value="embedded">Ma page charge déjà dsfr-data (composants seuls)</option>
            <option value="dynamic">Page autonome (avec scripts et CSS)</option>
          </select>
        </div>
        <pre class="carto-code" id="code-output"></pre>
      </div>
    </div>
  </div><!-- /.carto-tabs -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.module.min.js" integrity="sha384-gPgRd2+olihO/srZe/Bqw6iVLiiaL7meuri1d5YVMejwPXg7VehLSBeORYq9yh2F" crossorigin="anonymous"></script>
</body>
</html>
