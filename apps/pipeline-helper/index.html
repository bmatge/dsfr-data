<!DOCTYPE html>
<html lang="fr" data-fr-scheme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts builder — Pipeline</title>
  <style>@view-transition{navigation:auto}app-header:not(:defined){display:block;min-height:56px}app-footer:not(:defined){display:block;min-height:48px}</style>

  <!-- DSFR CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css" integrity="sha384-atVZ+aK6VI0nWyTEhKgze5InDJ+SWRRqa0BCZ2MTNyoOcBiHj1c3dGPdi6ML65B3" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/utility/utility.min.css" integrity="sha384-5P5DFFqorcEBpfnK9WHu/Ralfr7ZxyCZh0ryaJbgucSvc71+qRYdGvNEcyMqQwa/" crossorigin="anonymous">

  <!-- dsfr-data library -->
  <script type="module" src="../../packages/core/dist/dsfr-data.esm.js"></script>
  <script type="module" src="../../packages/app-ui/dist/app-ui.esm.js"></script>

  <!-- App entry point -->
  <script type="module" src="src/main.ts"></script>
</head>
<body>
  <app-header current-page="pipeline-helper" base-path="../../"></app-header>

  <!-- Barre d'actions unique (docs/ux/actions.md §5, lot UX 2 #539). Ids

       historiques conservés (#btn-add-*, #btn-delete, #btn-arrange, #btn-fit,

       #btn-execute, #btn-generate, #btn-toggle-help) ; « Visite guidée »

       bascule le bandeau d'aide jusqu'au tour du lot 7 (#544) ; la modale

       « code » reste jusqu'au PreviewPanel du lot 4 (#541). -->

  <app-action-bar heading="Pipeline">

    <button slot="tertiary" id="btn-toggle-help" data-variant="no-outline" class="fr-icon-question-line fr-btn--icon-left">Visite guidée</button>

    <button slot="tertiary" id="btn-delete" class="fr-icon-delete-line fr-btn--icon-left" title="Supprimer le(s) nœud(s) sélectionné(s) (ou touche Suppr)">Supprimer</button>

    <button slot="tertiary" id="btn-arrange" class="fr-icon-layout-grid-line fr-btn--icon-left" title="Réorganiser automatiquement les nœuds">Réorganiser</button>

    <button slot="tertiary" id="btn-fit" class="fr-icon-zoom-in-line fr-btn--icon-left" title="Recentrer la vue sur tous les nœuds">Recentrer</button>

    <app-menu slot="secondary" label="Ajouter une étape">

      <button id="btn-add-source" class="fr-icon-database-line" title="Ajouter une source de données (fetch HTTP)">Source</button>

      <button id="btn-add-normalize" class="fr-icon-edit-line" title="Normaliser les données (types, renommage, trim, aplatir)">Normaliser</button>

      <button id="btn-add-query" class="fr-icon-filter-line" title="Transformer les données (filtre, groupe, tri, agrégation)">Requêter</button>

      <button id="btn-add-join" class="fr-icon-git-merge-line" title="Joindre deux sources sur une clé pivot">Joindre</button>

      <button id="btn-add-search" class="fr-icon-search-line" title="Ajouter une barre de recherche textuelle">Rechercher</button>

      <button id="btn-add-facets" class="fr-icon-list-unordered" title="Ajouter des filtres à facettes interactifs">Facettes</button>

      <button id="btn-add-output" class="fr-icon-check-line" title="Données reçues en bout de chaîne">Sortie</button>

    </app-menu>

    <button slot="secondary" id="btn-generate" class="fr-icon-clipboard-line fr-btn--icon-left" title="Voir et copier le code HTML correspondant au pipeline">Copier le code</button>

    <app-menu slot="secondary" label="Ouvrir dans">

      <button id="open-playground-btn" title="Ouvrir le code du pipeline dans le Playground">Playground</button>

    </app-menu>

    <button slot="primary" id="btn-execute" class="fr-icon-play-line fr-btn--icon-left" title="Exécuter le pipeline : fetch, transformations et rendu">Exécuter</button>

  </app-action-bar>


  <div class="pipeline-page">
    <!-- Main content: 2/3 editor + 1/3 inspector -->
    <div class="pipeline-layout">
      <div class="pipeline-layout__editor">
        <div id="rete-container"></div>
      </div>
      <div class="pipeline-layout__inspector" id="inspector-panel">
        <!-- Onglets DSFR natifs Inspecteur · Code (lot UX 4 #541) : le code
             remplace la modale « Code HTML généré ». -->
        <div class="fr-tabs pipeline-tabs">
          <ul class="fr-tabs__list" role="tablist" aria-label="Panneau latéral">
            <li role="presentation">
              <button type="button" id="pipeline-tab-inspector-btn" class="fr-tabs__tab" tabindex="0" role="tab" aria-selected="true" aria-controls="pipeline-tab-inspector">Inspecteur</button>
            </li>
            <li role="presentation">
              <button type="button" id="pipeline-tab-code-btn" class="fr-tabs__tab" tabindex="-1" role="tab" aria-selected="false" aria-controls="pipeline-tab-code">Code</button>
            </li>
          </ul>
          <div id="pipeline-tab-inspector" class="fr-tabs__panel fr-tabs__panel--selected pipeline-tabs__panel" role="tabpanel" aria-labelledby="pipeline-tab-inspector-btn" tabindex="0">
            <div class="inspector" id="inspector">
              <div class="inspector__empty">
                <div class="inspector__empty-icon">&#8592;</div>
                <p>Cliquez sur un nœud du pipeline pour inspecter ses données.</p>
                <p class="inspector__hint">Exécutez d'abord le pipeline pour voir les données circuler.</p>
              </div>
            </div>
          </div>
          <div id="pipeline-tab-code" class="fr-tabs__panel pipeline-tabs__panel" role="tabpanel" aria-labelledby="pipeline-tab-code-btn" tabindex="0">
            <pre class="pipeline-code" id="code-output"></pre>
          </div>
        </div>
      </div>
    </div>

      </div>
    </div>
  </div>

  <!-- Footer -->
  <app-footer base-path="../../"></app-footer>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.module.min.js" integrity="sha384-gPgRd2+olihO/srZe/Bqw6iVLiiaL7meuri1d5YVMejwPXg7VehLSBeORYq9yh2F" crossorigin="anonymous"></script>
</body>
</html>
