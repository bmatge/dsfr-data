<!DOCTYPE html>
<html lang="fr" data-fr-scheme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Charts builder — Playground</title>
  <style>@view-transition{navigation:auto}app-header:not(:defined){display:block;min-height:141px}@media (min-width:62em){app-header:not(:defined){min-height:175px}}app-footer:not(:defined){display:block;min-height:48px}</style>

  <!-- DSFR -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.min.css" integrity="sha384-atVZ+aK6VI0nWyTEhKgze5InDJ+SWRRqa0BCZ2MTNyoOcBiHj1c3dGPdi6ML65B3" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/utility/utility.min.css" integrity="sha384-5P5DFFqorcEBpfnK9WHu/Ralfr7ZxyCZh0ryaJbgucSvc71+qRYdGvNEcyMqQwa/" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" integrity="sha384-6FSSi597BTd6QcnsBNoLclRKxTOyyYqkaucRjFgCNr8wHVCp0COLClSPY4Vy/bjh" crossorigin="anonymous">

  <!-- DSFR Chart -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.css" integrity="sha384-5m9vgfA+uOR3qcY14HhRzWDK17cwEVXO75RSwv2KJXignSdIrOvz1xNaaDpWXCeu" crossorigin="anonymous">
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr-chart@2.1.1/dist/DSFRChart/DSFRChart.js" integrity="sha384-OJTIJmv0zL1Ym2Bd6hA0oHB25gTqveSogoyVtnN3cEJcm4qE28qzTEp56vJeeKIS" crossorigin="anonymous"></script>

  <!-- CodeMirror -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.css" integrity="sha384-phfEUVAmRZV1Pzn/Xgxc3NH6zPMDuer0wHU9jRQKhNBBLyV4MP1gaBY1sxfxxPRT" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/theme/dracula.min.css" integrity="sha384-x8lRPRQIKDM8OaOd48WULD2bM7Ek4keq8dc8Czoge+6Pa0L7SuAsng4I4HyFI4kQ" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/lib/codemirror.min.js" integrity="sha384-CtBuRlcKITyrd+aBeTPNFB1/T8+kvtNQiWMCLtiGvD6NpLOJAdt8e8PpJJ2Gn1D0" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/htmlmixed/htmlmixed.min.js" integrity="sha384-st1zXlDDuVMrVzC853QA1g8CRGGc0xA2vSXGxn8U2YP2TldAsbkYQ6YI2R6vIW7/" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/xml/xml.min.js" integrity="sha384-3lcOr/GhqbTlJj8KlqKu4T5I0FPqlJYHQF7HahKTcptzg/jdReJp8nhmUdItNhq0" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/javascript/javascript.min.js" integrity="sha384-mNZ6k35sVNu7sE23KjWGt9HV//tFtxOxxBee7FzGSe32oiIpEd2jtDYWLJyciRSy" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.16/mode/css/css.min.js" integrity="sha384-NkxEGGROUEEdSnL9fe7+sHh7etzS2GkUcwyirQtcV2pYmnaXTJ9no9lSm8PmwCpj" crossorigin="anonymous"></script>


  <!-- Composants dsfr-data -->
  <script type="module" src="../../packages/core/dist/dsfr-data.esm.js"></script>
  <script type="module" src="../../packages/app-ui/dist/app-ui.esm.js"></script>

  <!-- App styles -->
  <link rel="stylesheet" href="src/styles/playground.css">
</head>
<body>
  <!-- Header -->
  <app-header current-page="playground" base-path="../.."></app-header>

  <!-- Barre d'actions unique (docs/ux/actions.md §5, lot UX 2 #539) : les ids
       historiques (#run-btn, #reset-btn, #deps-btn, #export-*-btn, #copy-btn,
       #save-btn, #pipeline-btn) sont conservés, main.ts ne change pas de câblage. -->
  <app-action-bar heading="Playground" data-zone="playground.actions" data-repere-libelle="Barre d'actions">
    <button slot="help" id="tour-btn" data-repere="playground.actions.visite" class="fr-icon-question-line">Visite guidée</button>
    <div slot="context" class="example-selector">
      <!-- La barre ne garde qu'une bascule : filtres, liste et actions vivent
           dans le volet lateral, ancre sur la colonne de code. -->
      <button id="volet-btn" type="button" data-repere="playground.actions.exemples"
        class="fr-btn fr-btn--secondary fr-btn--sm fr-icon-menu-2-fill fr-btn--icon-left"
        aria-expanded="false" aria-controls="volet-exemples">
        Exemples <span id="compteur-exemples" class="volet-compteur"></span>
      </button>
    </div>
    <button slot="secondary" id="copy-btn" data-repere="playground.actions.copier" class="fr-icon-clipboard-line fr-btn--icon-left">Copier le code</button>
    <button slot="tertiary" id="save-btn" data-repere="playground.actions.favori" class="fr-icon-star-line" title="Enregistrer ce code dans vos favoris">Ajouter aux favoris</button>
    <button slot="tertiary" id="pipeline-btn" data-repere="playground.actions.pipeline" class="fr-icon-git-branch-line" title="Visualiser le pipeline de composants dans le Pipeline Helper">Ouvrir dans le Pipeline</button>
    <!-- Passation vers le Studio IA (#1132) : code, source publique et diagnostic,
         posés dans le champ du Studio sans être envoyés au modèle. -->
    <button slot="tertiary" id="studio-btn" data-repere="playground.actions.studio" class="fr-icon-sparkling-2-line" title="Reprendre ce code dans le Studio IA : la source est chargée, la demande de reconstruction attend votre relecture">Ouvrir dans le Studio IA</button>
    <button slot="tertiary" id="export-png-btn" data-repere="playground.actions.png" class="fr-icon-image-line" title="Exporter l'aperçu en PNG">Exporter en PNG</button>
    <button slot="tertiary" id="export-jpg-btn" data-repere="playground.actions.jpg" class="fr-icon-image-line" title="Exporter l'aperçu en JPG">Exporter en JPG</button>
    <button slot="tertiary" id="deps-btn" data-repere="playground.actions.dependances" class="fr-icon-code-s-slash-line" title="Ajouter les CSS/JS nécessaires pour intégrer le code dans une page externe">Ajouter des dépendances</button>
    <button slot="tertiary" id="diagnostic-btn" data-repere="playground.actions.diagnostic" class="fr-icon-tools-line" title="Ouvrir le volet Diagnostic : ce qui transite entre les composants du pipeline">Diagnostic</button>
    <!-- Assistant contextuel (#1017, #1018) : déclaré ici pour porter son repère. -->
    <button slot="tertiary" id="assistant-btn" data-repere="playground.actions.assistant" class="fr-icon-question-answer-line" title="Ouvrir l'assistant : où se trouve un réglage, ce qu'il faut corriger" aria-expanded="false">Assistant</button>
    <button slot="primary" id="run-btn" data-repere="playground.actions.executer" class="fr-icon-play-line fr-btn--icon-left">Exécuter</button>
  </app-action-bar>


  <app-layout-builder mode="sticky-left" left-ratio="50">
    <div slot="left" class="playground-editor">
      <!-- Zone de l'editeur (#1009) : le textarea d'origine, que CodeMirror
           masque pour inserer son rendu juste a cote, dans cette meme zone. -->
      <div class="pg-editeur" data-zone="playground.editeur" role="group" aria-label="Éditeur de code">
        <textarea id="code-editor" data-repere="playground.editeur.code" aria-label="Code HTML"></textarea>
      </div>

      <!-- Volet lateral, sur le modele de dsfr-data-map-popup mode="panel-left" :
           ancre en absolu dans son conteneur (pas en fixed sur le viewport),
           glisse depuis la gauche, se ferme par sa croix ou par Echap.
           Les <option> des quatre selects sont peuplees par selector.ts. -->
      <aside id="volet-exemples" class="pg-volet" role="complementary" data-zone="playground.exemples"
        aria-label="Parcourir les exemples" inert>
        <div class="pg-volet__entete">
          <h2 class="pg-volet__titre">
            Exemples <span id="compteur-volet" class="pg-volet__compteur"></span>
          </h2>
          <button id="volet-fermer" type="button" data-repere="playground.exemples.fermer"
            class="fr-btn fr-btn--sm fr-btn--tertiary-no-outline fr-icon-close-line"
            title="Fermer le volet" aria-label="Fermer le volet"></button>
        </div>

        <div class="pg-volet__corps">
          <div class="example-filters">
            <div class="example-filter">
              <label class="fr-label" for="filtre-source">Source</label>
              <select id="filtre-source" data-repere="playground.exemples.source" class="fr-select fr-select--sm"></select>
            </div>
            <div class="example-filter">
              <label class="fr-label" for="filtre-pipeline">Pipeline</label>
              <select id="filtre-pipeline" data-repere="playground.exemples.pipeline" class="fr-select fr-select--sm"></select>
            </div>
            <div class="example-filter">
              <label class="fr-label" for="filtre-sortie">Sortie</label>
              <select id="filtre-sortie" data-repere="playground.exemples.sortie" class="fr-select fr-select--sm"></select>
            </div>
          </div>
        </div>

        <!-- Le resultat du filtrage sort du corps defilant : c'est le champ
             qui sert, il reste sous les yeux quelle que soit la hauteur. -->
        <div class="pg-volet__choix">
          <div class="example-filter">
            <label class="fr-label" for="example-select">Exemple</label>
            <select id="example-select" data-repere="playground.exemples.exemple" class="fr-select fr-select--sm"></select>
          </div>
        </div>

        <div class="pg-volet__pied">
          <button id="voir-exemple-btn" type="button" data-repere="playground.exemples.voir"
            class="fr-btn fr-btn--sm fr-icon-eye-line fr-btn--icon-left">
            Voir l'exemple
          </button>
          <button id="reset-btn" type="button" data-repere="playground.exemples.reinitialiser"
            class="fr-btn fr-btn--sm fr-btn--secondary fr-icon-refresh-line fr-btn--icon-left"
            title="Recharger l’exemple sélectionné">
            Réinitialiser
          </button>
        </div>
      </aside>
    </div>
    <div slot="right" class="playground-preview" data-zone="playground.apercu" role="region" aria-label="Aperçu">
      <iframe id="preview-frame" class="preview-frame" sandbox="allow-scripts allow-same-origin allow-downloads allow-popups" title="Aperçu du code"></iframe>
    </div>
  </app-layout-builder>

  <!-- Footer -->
  <app-footer base-path="../.." variant="slim"></app-footer>

  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.14.4/dist/dsfr.module.min.js" integrity="sha384-gPgRd2+olihO/srZe/Bqw6iVLiiaL7meuri1d5YVMejwPXg7VehLSBeORYq9yh2F" crossorigin="anonymous"></script>
  <!-- App entry point -->
  <script type="module" src="src/main.ts"></script>
</body>
</html>
