# DÉRIVÉ de proxy/relay/nginx/ par tests/relay/nginx/banc.mjs — ne pas modifier à la main.
# Hôtes renommés en ceux du profil de conformance ; amont : le faux amont local, en clair.
# Relais cachable (ADR-155) — les clés d'API, niveau `http {}`. EXEMPLE.
#
# Le fichier réel vit HORS DU DÉPÔT (par exemple /etc/nginx/secrets/relais-cles.conf,
# lisible par root seul : nginx lit sa configuration avant de quitter ses droits) et ne
# se versionne pas. La valeur ci-dessous est fictive.
#
# La clé d'un hôte n'est envoyée qu'à cet hôte (C-AMONT-2) : elle est choisie par
# `$relais_hote`, que pose la `location`, jamais par ce qu'envoie le visiteur. La valeur
# est l'en-tête `Authorization` entier, préfixe compris.
#
# Sans hôte à clé, garder la `map` avec sa seule ligne `default` : relais-hote.conf lit
# `$relais_cle`.
#
# Une clé confiée au relais rend public tout ce qu'elle sait lire sur l'hôte autorisé :
# clé en LECTURE SEULE, et préfixe de chemin obligatoire dans la `location` de l'hôte
# (docs/RELAY.md §3).

map $relais_hote $relais_cle {
    default               "";
    cle.conformance.test "Apikey cle-fictive-de-conformance";
}
